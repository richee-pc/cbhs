<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Project AGI: 잠긴 연구소</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--cyan:#06b6d4;--emerald:#10b981;--red:#ef4444;--violet:#a855f7;}
  html,body{background:var(--bg);color:#e2e8f0;font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  .font-orb{font-family:'Orbitron','Noto Sans KR',sans-serif;}
  .font-mono2{font-family:'JetBrains Mono','Noto Sans KR',monospace;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:linear-gradient(rgba(6,182,212,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,.07) 1px,transparent 1px);
    background-size:28px 28px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;}
  .glow-c{text-shadow:0 0 6px rgba(6,182,212,.9),0 0 18px rgba(6,182,212,.6);}
  .glow-e{text-shadow:0 0 6px rgba(16,185,129,.9),0 0 18px rgba(16,185,129,.6);}
  .glow-r{text-shadow:0 0 6px rgba(239,68,68,.9),0 0 18px rgba(239,68,68,.6);}
  .panel{background:linear-gradient(160deg,rgba(15,23,42,.92),rgba(30,41,59,.85));border:1px solid rgba(6,182,212,.35);
    box-shadow:0 0 0 1px rgba(6,182,212,.08) inset,0 0 24px rgba(6,182,212,.15);backdrop-filter:blur(6px);}
  .btn-neon{border:1px solid rgba(6,182,212,.55);background:rgba(6,182,212,.08);transition:all .15s;}
  .btn-neon:active{transform:scale(.97);background:rgba(6,182,212,.25);}
  .btn-solid{background:linear-gradient(90deg,#0891b2,#06b6d4);box-shadow:0 0 20px rgba(6,182,212,.5);color:#0f172a;font-weight:900;transition:transform .12s;}
  .btn-solid:active{transform:scale(.97);}
  .btn-solid:disabled,.btn-neon:disabled{opacity:.35;filter:grayscale(.7);}
  .noselect{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .tip{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:10px;}
  .num{font-family:'Orbitron',sans-serif;color:#67e8f9;width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid rgba(6,182,212,.6);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .scanbar{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#06b6d4,#a5f3fc,#06b6d4,transparent);
    box-shadow:0 0 14px 3px rgba(6,182,212,.7);animation:scan 2.6s ease-in-out infinite;pointer-events:none;z-index:5;}
  @keyframes scan{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
  .caret::after{content:"▋";color:#06b6d4;animation:blink 1s steps(1) infinite;margin-left:2px;}
  @keyframes blink{50%{opacity:0}}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;background:radial-gradient(ellipse at center,rgba(239,68,68,.15),rgba(239,68,68,.65));}
  .flash-on{animation:redflash .9s ease-out;}
  @keyframes redflash{0%,40%{opacity:1}20%,60%{opacity:.2}100%{opacity:0}}
  .shake{animation:shake .45s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  .fade-in{animation:fadein .4s ease-out;}
  @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sel{border-color:#06b6d4!important;background:rgba(6,182,212,.22)!important;box-shadow:0 0 16px rgba(6,182,212,.5);}
  .ok{border-color:#10b981!important;background:rgba(16,185,129,.25)!important;box-shadow:0 0 18px rgba(16,185,129,.6)!important;}
  .bad{border-color:#ef4444!important;background:rgba(239,68,68,.2)!important;}
  .hot{background:rgba(6,182,212,.25)!important;box-shadow:0 0 24px #06b6d4;transform:scale(1.03);}
  .pulse-ring{animation:ring 2s infinite;}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(6,182,212,.6)}70%{box-shadow:0 0 0 14px rgba(6,182,212,0)}100%{box-shadow:0 0 0 0 rgba(6,182,212,0)}}
  .eye{animation:eye 3.5s ease-in-out infinite;transform-origin:center;}
  @keyframes eye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .rot{animation:rot 12s linear infinite;transform-origin:center;}
  @keyframes rot{to{transform:rotate(360deg)}}
  /* slider */
  input[type=range].cyber{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;
    background:linear-gradient(90deg,#10b981,#06b6d4,#a855f7,#ef4444);outline:none;box-shadow:0 0 12px rgba(6,182,212,.5);}
  input[type=range].cyber::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#0f172a;border:3px solid #a5f3fc;box-shadow:0 0 16px #06b6d4;}
  input[type=range].cyber::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#0f172a;border:3px solid #a5f3fc;box-shadow:0 0 16px #06b6d4;}
  /* wire */
  .wire .wl,.wire .wr{transition:transform .25s;}
  .wire .wl{transform-origin:left center}.wire .wr{transform-origin:right center}
  .wire.cut .wl{transform:translateX(-10px) rotate(-12deg);}
  .wire.cut .wr{transform:translateX(10px) rotate(12deg);}
  .term{width:10px;height:16px;border-radius:3px;background:#475569;flex-shrink:0;}
  /* bug */
  .bug{will-change:transform;}
  /* certificate hologram */
  .holo{position:relative;overflow:hidden;}
  .holo::before{content:"";position:absolute;inset:-50%;pointer-events:none;
    background:conic-gradient(from 0deg,rgba(6,182,212,.0),rgba(6,182,212,.25),rgba(168,85,247,.25),rgba(16,185,129,.25),rgba(236,72,153,.2),rgba(6,182,212,0));
    animation:rot 6s linear infinite;mix-blend-mode:screen;}
  .holo::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;pointer-events:none;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.8s ease-in-out infinite;}
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  .seal{animation:sealpulse 1.6s ease-in-out infinite;}
  @keyframes sealpulse{0%,100%{transform:scale(1) rotate(0);filter:hue-rotate(0)}50%{transform:scale(1.08) rotate(8deg);filter:hue-rotate(90deg)}}
  @keyframes gradmove{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .marquee{white-space:nowrap;animation:marq 9s linear infinite;display:inline-block;}
  @keyframes marq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:55;}
  .safe-b{padding-bottom:max(16px,env(safe-area-inset-bottom));}
</style>
</head>
<body class="min-h-screen overflow-x-hidden">
<div id="flash"></div>
<canvas id="confetti"></canvas>

<main id="app" class="relative z-10 mx-auto max-w-md min-h-screen px-4 pt-5 safe-b"></main>

<script>
/* =========================================================
   ★ 선생님 설정 구역 — 등급 기준 & 선물 문구를 자유롭게 바꾸세요
   점수 = 100 - (오답 × 10) - (힌트 × 5)
========================================================= */
const GRADES=[
  {g:'S',min:100,title:'레전드 화이트해커',prize:'🏆 S등급 특별 선물',color:'#facc15'},
  {g:'A',min:85, title:'엘리트 해커',      prize:'🎁 A등급 선물',     color:'#06b6d4'},
  {g:'B',min:70, title:'정예 요원',        prize:'🍫 B등급 선물',     color:'#10b981'},
  {g:'C',min:0,  title:'견습 요원',        prize:'🍬 참가 선물',      color:'#a855f7'},
];
const MISSION_COUNT=7;          // 출제 문항 수 (구역당 1문제)
const WRONG_LOCK_SEC=3;         // 오답 시 잠금 시간(초)
const HINT_COOLDOWN_SEC=5;      // 힌트 쿨타임(초)
const MAX_ATTEMPTS=3;           // 1인당 도전 가능 횟수 (그중 최고 등급으로 선물)
const SCHOOL='조선대학교부속고등학교';
const EVENT_NAME='2026 AI·SW 교육주간';

/* =========================================================
   1. 문제 은행 — 김경수 저 《AI 읽는 힘, 보는 힘(AI 문해력·문화력)》(길벗캠퍼스, 2026)
   13강 목차(178개 질문)를 7개 구역으로 묶어 출제 · 각 문항의 ref = 책의 해당 질문 번호
   type: mc(4지선다) / ox(참·거짓) / word(암호 조각 맞추기)
========================================================= */
const zones = [
  {id:1,name:"AI 문해력과 LLM",lecture:"1~3강",icon:"🧠",proto:"NEURAL-CORE"},
  {id:2,name:"산업혁명과 AI 반도체",lecture:"4강",icon:"💾",proto:"SILICON-GATE"},
  {id:3,name:"AI 패권과 피지컬 AI",lecture:"5~6강",icon:"⚡",proto:"POWER-GRID"},
  {id:4,name:"일자리 대전환과 질문의 힘",lecture:"7~8강",icon:"⌨️",proto:"PROMPT-KEY"},
  {id:5,name:"1인 미디어와 알고리즘",lecture:"9~10강",icon:"📱",proto:"FEED-FILTER"},
  {id:6,name:"AI 방어 문해력",lecture:"11강",icon:"🛡️",proto:"SHIELD-SCAN"},
  {id:7,name:"AI 윤리와 AI 문화력",lecture:"12~13강",icon:"⚖️",proto:"CULTURE-CORE"},
];

const quizData = [
  /* ---------- 구역 1 · 1~3강: 왜 AI 문해력·문화력인가 / AI 개념 / LLM·환각 ---------- */
  {id:1,zone:1,ref:"1강",type:'mc',q:"이 책은 'AI 문해력'과 'AI 문화력'을 각각 어떤 힘으로 정의할까요?",options:["문해력은 해석하는 힘, 문화력은 발산하는 힘","문해력은 암기하는 힘, 문화력은 계산하는 힘","문해력은 타자 속도, 문화력은 코딩 실력","문해력은 검색 능력, 문화력은 소비 능력"],answer:0,hint:"AI를 읽고 '해석'하고, 그것을 문화로 '발산'합니다."},
  {id:2,zone:1,ref:"Q25",type:'mc',q:"생성형 AI가 마치 사실인 것처럼 그럴듯하게 거짓 정보를 지어내는 현상을 무엇이라고 부를까요?",options:["할루시네이션(환각)","딥페이크","오버클럭","바이브코딩"],answer:0,hint:"영어로 '환각'을 뜻하는 단어입니다."},
  {id:3,zone:1,ref:"Q24",type:'mc',q:"거대언어모델(LLM)이 방대한 빅데이터를 처리할 때 글자를 쪼개는 가장 작은 단위를 무엇이라 할까요?",options:["바이트","토큰(Token)","픽셀","알고리즘"],answer:1,hint:"놀이공원에서 쓰던 코인이나 표를 생각해보세요."},
  {id:4,zone:1,ref:"Q12",type:'mc',q:"2024년 노벨 화학상은 단백질 구조를 예측한 AI 연구자들에게 돌아갔습니다. 구글 딥마인드가 만든 이 AI의 이름은?",options:["알파고","알파폴드","제미나이","챗GPT"],answer:1,hint:"단백질이 '접히는(Fold)' 구조를 해석했습니다."},
  {id:5,zone:1,ref:"Q9",type:'ox',q:"딥러닝은 머신러닝의 한 분야로, 인공신경망을 여러 층 깊게(Deep) 쌓아 학습하는 기술이다.",answer:true,hint:"AI ⊃ 머신러닝 ⊃ 딥러닝의 포함 관계를 떠올려 보세요.",explain:"AI 안에 머신러닝이, 머신러닝 안에 딥러닝이 포함됩니다."},
  {id:6,zone:1,ref:"1강",type:'ox',q:"책에서 말하는 'AX'는 'AI 대전환(AI Transformation)'을 뜻한다.",answer:true,hint:"DX(디지털 전환)의 다음 단계예요.",explain:"AX는 AI Transformation, 즉 AI가 사회·산업 전반을 바꾸는 'AI 대전환'입니다."},
  {id:7,zone:1,ref:"Q10",type:'word',q:"1950년 '기계는 생각할 수 있는가?'라는 위대한 질문을 던진 컴퓨터 과학의 아버지, 앨런 ○○은?",word:"튜링",decoys:["뉴","턴","잡"],hint:"'○○ 테스트'로도 유명해요."},

  /* ---------- 구역 2 · 4강: 산업혁명 → 폴리매스 → 스마트폰 → AI 반도체 → GPU ---------- */
  {id:8,zone:2,ref:"4강",type:'mc',q:"AI의 방대한 병렬 연산을 처리하는 데 가장 널리 쓰이며, 엔비디아(NVIDIA)가 시장을 주도하는 핵심 칩은?",options:["GPU","CPU","RAM","하드디스크"],answer:0,hint:"게임 그래픽 카드로도 잘 알려져 있습니다."},
  {id:9,zone:2,ref:"Q43",type:'mc',q:"책 4강은 반도체 발전의 기준이 '무어의 법칙(인텔)'에서 무엇으로 옮겨갔다고 설명할까요?",options:["뉴턴의 법칙","황의 법칙(엔비디아)","파레토 법칙","머피의 법칙"],answer:1,hint:"엔비디아 CEO 젠슨 '황'의 이름을 땄습니다."},
  {id:10,zone:2,ref:"Q36",type:'mc',q:"여러 분야를 넘나들며 깊은 지식을 갖춘 사람으로, 책이 'AI 시대에 왜 필요한가'를 묻는 융합형 인재는?",options:["폴리매스","스페셜리스트","얼리어답터","인플루언서"],answer:0,hint:"레오나르도 다빈치처럼 예술·과학·공학을 넘나든 사람이에요."},
  {id:11,zone:2,ref:"Q31",type:'mc',q:"증기기관을 바탕으로 1차 산업혁명이 처음 시작된 나라는 어디일까요?",options:["영국","미국","중국","일본"],answer:0,hint:"제임스 와트의 나라, 런던이 수도예요."},
  {id:12,zone:2,ref:"Q39",type:'ox',q:"스마트폰은 전화기에 카메라·음악 재생·인터넷 등 여러 기능이 '융합'되면서 탄생했다.",answer:true,hint:"책 4.3의 키워드는 '폰의 융합'이에요.",explain:"폰 → 스마트폰 → AI폰으로 이어지는 진화의 핵심은 기능의 융합입니다."},
  {id:13,zone:2,ref:"Q42",type:'word',q:"전기가 통하는 도체와 통하지 않는 부도체의 중간 성질을 가져, AI 칩의 재료가 되는 것은?",word:"반도체",decoys:["전","자","칩"],hint:"'절반(半)'만 전기가 통하는 물체예요."},

  /* ---------- 구역 3 · 5~6강: 소버린 AI → AI 전력 → SMR → 그린 AI / 피지컬·에이전틱 AI ---------- */
  {id:14,zone:3,ref:"Q45",type:'mc',q:"국가가 외국 기술에 종속되지 않고 자국의 언어·문화·데이터를 지키기 위해 독자적으로 구축하는 AI는?",options:["오픈소스 AI","소버린 AI","글로벌 AI","퍼블릭 AI"],answer:1,hint:"'주권'을 뜻하는 영단어 Sovereign이 들어갑니다."},
  {id:15,zone:3,ref:"Q52",type:'mc',q:"AI 데이터센터에 막대한 전력을 탄소 배출 없이 안정적으로 공급할 방안으로 주목받는 소형 원자로는?",options:["풍력 발전","화력 발전","SMR","수력 발전"],answer:2,hint:"Small Modular Reactor(소형 모듈형 원자로)의 약자입니다."},
  {id:16,zone:3,ref:"Q59",type:'mc',q:"휴머노이드 로봇처럼 물리적인 몸을 갖고 현실 세계에서 직접 움직이며 일하는 AI를 무엇이라 할까요?",options:["소프트웨어 AI","메타버스 AI","피지컬 AI","클라우드 AI"],answer:2,hint:"'신체적, 물리적'을 뜻하는 영단어 Physical입니다."},
  {id:17,zone:3,ref:"Q71",type:'mc',q:"질문에 답만 하는 생성형 AI를 넘어, 스스로 목표를 세우고 계획해 여러 작업을 직접 실행하는 AI는?",options:["에이전틱 AI","계산기 AI","아날로그 AI","오프라인 AI"],answer:0,hint:"에이전트(Agent)는 '대리인'이라는 뜻이에요."},
  {id:18,zone:3,ref:"Q67",type:'ox',q:"온디바이스 AI는 클라우드 서버를 거치지 않고 스마트폰 같은 기기 안에서 직접 AI를 실행하는 기술이다.",answer:true,hint:"On-Device = 기기 위에서!",explain:"책 6.3은 AI가 '클라우드에서 온디바이스로' 옮겨 오고 있다고 설명합니다."},

/* =========================================================
   2. 사운드 (Web Audio API, 외부 파일 없음)
========================================================= */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(freq,dur=.1,type='square',vol=.08,delay=0,slideTo=null){
  const c=ac(); if(!c||muted)return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
const SFX={
  tap(){tone(1320,.05,'square',.05);},
  key(){tone(880,.04,'square',.05);tone(1760,.03,'sine',.03,.02);},
  type(){tone(2000+Math.random()*600,.015,'square',.015);},
  snip(){tone(3200,.04,'square',.08);tone(180,.12,'sawtooth',.08,.03,60);},
  swoosh(){tone(900,.18,'sine',.07,0,200);},
  correct(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09));tone(1568,.35,'sine',.06,.36);},
  wrong(){tone(140,.28,'sawtooth',.14);tone(110,.35,'sawtooth',.14,.3);},
  siren(){tone(600,.4,'sawtooth',.06,0,1200);tone(1200,.4,'sawtooth',.06,.4,600);},
  hint(){tone(700,.08,'sine',.08);tone(1050,.12,'sine',.08,.08);},
  unlock(){tone(300,.25,'sawtooth',.05,0,1800);[1047,1319,1568].forEach((f,i)=>tone(f,.12,'square',.05,.25+i*.07));},
  fanfare(){const n=[523,523,523,659,784,659,784,1047];const d=[0,.12,.24,.36,.6,.84,.96,1.1];n.forEach((f,i)=>{tone(f,.22,'triangle',.13,d[i]);tone(f/2,.22,'square',.04,d[i]);});tone(1047,.9,'sine',.08,1.3);},
};

let typeToken=0;
async function typeText(el,text,speed=22,sound=true){
  const my=++typeToken; el.textContent=''; el.classList.add('caret');
  for(let i=0;i<text.length;i++){
    if(my!==typeToken){el.textContent=text;break;}
    el.textContent+=text[i]; if(sound&&i%2===0)SFX.type(); await sleep(speed);
  }
  if(my===typeToken)el.classList.remove('caret');
}
function skipTyping(){typeToken++;document.querySelectorAll('.caret').forEach(e=>e.classList.remove('caret'));}

function redFlash(){const f=$('#flash');f.classList.remove('flash-on');void f.offsetWidth;f.classList.add('flash-on');}
function shakeEl(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

/* Confetti (순수 Canvas) */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],confRAF=null;
function resizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',resizeCv);resizeCv();
function confetti(n=90,big=false){
  const cols=['#06b6d4','#10b981','#a855f7','#f472b6','#facc15','#a5f3fc'];
  for(let i=0;i<n;i++){
    const fromSide=big&&i%2;
    parts.push({x:fromSide?(i%4<2?0:innerWidth):innerWidth/2+(Math.random()-.5)*80,y:fromSide?innerHeight*.7:innerHeight*.38,
      vx:fromSide?(i%4<2?1:-1)*(4+Math.random()*7):(Math.random()-.5)*12,vy:-(6+Math.random()*(big?12:8)),
      s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0,shape:Math.random()<.3?'c':'r'});
  }
  if(!confRAF)loopConf();
}
function loopConf(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=8;
    if(p.shape==='c'){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill();}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<300);
  confRAF=parts.length?requestAnimationFrame(loopConf):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

/* =========================================================
   4. 위조 방지 코드 — 등급이 코드 안에 숨겨져 있음 (교사용 검증기로 확인)
   형식: AI-2026-XXXX  (난수 2 + 등급 암호 1 + 검증문자 1)
========================================================= */
const CS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 혼동 문자(0,O,1,I) 제외 32자
const SALT=[7,13,29];
function checkChar(a){let s=11;a.forEach((ch,i)=>{s=(s*31+CS.indexOf(ch)*SALT[i]+i*5)%997;});return CS[s%32];}
// 형식: 난수 1 + 회차 암호 1 + 등급 암호 1 + 검증문자 1
function genCode(gi,att){const r=new Uint8Array(3);crypto.getRandomValues(r);
  const a=[CS[r[0]%32],CS[(Math.min(Math.max(att||1,1),4)-1)*8+r[1]%8],CS[gi*8+r[2]%8]];return `AI-2026-${a.join('')}${checkChar(a)}`;}
function verifyCode(code){
  const m=String(code).toUpperCase().replace(/\s/g,'').match(/^AI-?2026-?([A-Z2-9]{4})$/);if(!m)return null;
  const a=m[1].split('');if(a.some(c=>CS.indexOf(c)<0))return null;
  if(checkChar(a.slice(0,3))!==a[3])return null;
  return {G:GRADES[Math.floor(CS.indexOf(a[2])/8)],att:Math.floor(CS.indexOf(a[1])/8)+1};
}

/* 도전 기록 (이 기기에 저장) — 도전 횟수 제한 & 최고 등급 관리 */
const STORE_KEY='agi_cbhs_2026';
let memRec=null; // 저장소가 막힌 브라우저(사생활 보호 모드 등)용 대체 기록
function loadRec(){let r=null;try{r=JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){r=memRec&&JSON.parse(memRec);}
  r=r&&Array.isArray(r.runs)?r:{used:0,runs:[],sid:'',sname:'',final:false};
  if(r.used>=MAX_ATTEMPTS)r.final=true; // 기회를 다 쓰면(포기 포함) 자동 확정
  return r;}
function saveRec(r){memRec=JSON.stringify(r);try{localStorage.setItem(STORE_KEY,memRec);}catch(e){}}
function clearRec(){memRec=null;try{localStorage.removeItem(STORE_KEY);}catch(e){}}
function bestRun(r){return r.runs.reduce((b,x)=>(!b||x.gi<b.gi||(x.gi===b.gi&&x.sc>b.sc))?x:b,null);}
const leftOf=r=>r.final?0:Math.max(0,MAX_ATTEMPTS-r.used);

const MC_GIMMICKS=['choice','keypad','slider','wire','hold','drag','target','timing'];
const SHORT_ONLY=['target','drag']; // 보기가 짧은 문제만 가능
const isShort=q=>q.options.every(o=>o.length<=16);

let S={};
let lockTimer=null,hintTimer=null,clockTimer=null,elapsedTimer=null,gLoop=null;
function stopLoop(){if(gLoop){cancelAnimationFrame(gLoop);gLoop=null;}}

function prepare(q,g){
  if(q.type==='mc'){const order=shuffle([0,1,2,3]);return {...q,gimmick:g,opts:order.map(k=>q.options[k]),ans:order.indexOf(q.answer)};}
  if(q.type==='ox')return {...q,gimmick:g,ans:q.answer};
  return {...q,gimmick:g,ans:q.word,chips:shuffle([...q.word,...q.decoys])};
}

function newGame(){
  // 매 판마다 10가지 해제 방식 중 7가지를 겹치지 않게 랜덤 배치
  const plan=shuffle(['swipe','word',...shuffle(MC_GIMMICKS).slice(0,MISSION_COUNT-2)]);
  const zs=MISSION_COUNT>=zones.length?zones:shuffle(zones).slice(0,MISSION_COUNT).sort((a,b)=>a.id-b.id);
  const list=zs.map((z,k)=>{
    const g=plan[k%plan.length];
    let pool;
    if(g==='swipe')pool=quizData.filter(q=>q.zone===z.id&&q.type==='ox');
    else if(g==='word')pool=quizData.filter(q=>q.zone===z.id&&q.type==='word');
    else{pool=quizData.filter(q=>q.zone===z.id&&q.type==='mc');
      if(SHORT_ONLY.includes(g)){const sh=pool.filter(isShort);if(sh.length)pool=sh;else return prepare(pick(pool),'choice');}}
    return prepare(pick(pool),g);
  });
  S={list,idx:0,mistakes:0,hints:0,perfect:0,triedWrong:false,hintUsedHere:false,start:Date.now(),end:null,locked:false,hintCooldownUntil:0,attempt:0};
  const rec=loadRec();rec.used++;saveRec(rec);S.attempt=rec.used; // 시작하는 순간 1회 차감 (새로고침·포기 포함)
}

function calcScore(){const sc=Math.max(0,100-S.mistakes*10-S.hints*5);const gi=GRADES.findIndex(x=>sc>=x.min);return {sc,gi,G:GRADES[gi]};}

function renderGimmick(q){GIMMICKS[q.gimmick](q,$('#gimmick'));}

function updateHintBtn(){
  const b=$('#hintBtn');if(!b)return;clearInterval(hintTimer);
  const upd=()=>{const left=Math.ceil((S.hintCooldownUntil-Date.now())/1000);
    if(left>0){b.disabled=true;b.textContent=`💡 쿨타임 ${left}초`;}else{b.disabled=false;b.textContent=S.hintUsedHere?'💡 힌트 다시 보기':'💡 힌트 열람 (−5점)';clearInterval(hintTimer);}};
  upd();hintTimer=setInterval(upd,250);
}
function useHint(q){
  if(Date.now()<S.hintCooldownUntil)return;
  if(!S.hintUsedHere){S.hints++;S.hintUsedHere=true;}
  SFX.hint();const h=$('#hintBox');h.classList.remove('hidden');
  h.innerHTML=`<b>💡 해커 노트:</b> ${esc(q.hint)}`;
  S.hintCooldownUntil=Date.now()+HINT_COOLDOWN_SEC*1000;updateHintBtn();
}

function answerText(q){
  if(q.type==='mc')return esc(q.opts[q.ans]);
  if(q.type==='ox')return (q.ans?'⭕ 참(TRUE)':'❌ 거짓(FAKE)')+(q.explain?`<span class="block text-[13px] font-normal text-slate-300 mt-2">${esc(q.explain)}</span>`:'');
  return esc(q.word);
}

function submit(val,el,onWrongReset){
  const q=S.list[S.idx];
  if(val===q.ans){
    S.locked=true;if(!S.triedWrong)S.perfect++;
    el&&el.classList.add('ok');SFX.correct();vibrate(40);confetti(70);
    const z=zones[q.zone-1],last=S.idx+1>=S.list.length;
    const ov=document.createElement('div');
    ov.className='fixed inset-0 z-40 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm px-6';
    ov.innerHTML=`<div class="panel rounded-2xl p-6 text-center w-full max-w-sm pop" style="border-color:#10b981;box-shadow:0 0 40px rgba(16,185,129,.5)">
      <div class="text-5xl mb-2">🔓</div>
      <p class="font-orb text-emerald-400 glow-e text-lg">ACCESS GRANTED</p>
      <p class="text-sm text-slate-300 mt-1">${z.proto} 프로토콜 해제! (${S.idx+1}/${S.list.length})</p>
      <p class="mt-3 text-[15px] font-bold">정답: ${answerText(q)}</p>
      ${q.ref?`<p class="text-[11px] text-cyan-300/80 mt-3">📖 《AI 읽는 힘, 보는 힘》 ${esc(q.ref)}${/^Q/.test(q.ref)?'번 질문':''}</p>`:''}
      <button class="btn-solid rounded-2xl p-4 mt-5 w-full" style="background:linear-gradient(90deg,#059669,#10b981)">${last?'🚪 최종 출입문 개방':'다음 프로토콜 ▶'}</button></div>`;
    document.body.appendChild(ov);
    ov.querySelector('button').onclick=()=>{SFX.unlock();ov.remove();stopLoop();S.idx++;
      if(!last)screenQuestion();else{S.end=Date.now();clearInterval(elapsedTimer);screenEscape();}};
  }else{
    S.mistakes++;S.triedWrong=true;S.locked=true;
    el&&el.classList.add('bad');SFX.wrong();redFlash();vibrate([120,60,120]);shakeEl($('#qwrap'));
    const lb=$('#lockBox'),lines=['ARGOS: "틀렸다, 인간."','ARGOS: "그 정도로는 날 못 이긴다."','ARGOS: "침입 시도 감지. 방어벽 강화."','ARGOS: "흥미롭군. 다시 해봐라."'];
    lb.classList.remove('hidden');let t=WRONG_LOCK_SEC;
    const draw=()=>lb.innerHTML=`🚨 ACCESS DENIED · 시스템 잠금 ${t}초 (−10점)<br><span class="font-normal text-pink-300 text-xs">${lines[S.mistakes%lines.length]}</span>`;draw();
    document.querySelectorAll('#gimmick button').forEach(b=>b.disabled=true);
    clearInterval(lockTimer);
    lockTimer=setInterval(()=>{t--;if(t>0){draw();tone(500,.05,'square',.04);}else{clearInterval(lockTimer);lb.classList.add('hidden');S.locked=false;
      document.querySelectorAll('#gimmick button').forEach(b=>b.disabled=false);el&&el.classList.remove('bad');onWrongReset&&onWrongReset();}},1000);
  }
}

/* =========================================================
   9. 화면: 탈출 성공 + 인증서
========================================================= */
async function screenEscape(){
  SFX.fanfare();confetti(160,true);setTimeout(()=>confetti(120,true),900);vibrate([60,40,60,40,200]);
  const dur=S.end-S.start,total=S.list.length,{sc,gi,G}=calcScore();
  // 이번 판 기록 저장
  const rec=loadRec(),prevBest=bestRun(rec);
  const run={att:S.attempt,sc,gi,dur,mistakes:S.mistakes,hints:S.hints,end:S.end,code:genCode(gi,S.attempt)};
  rec.runs.push(run);if(rec.used>=MAX_ATTEMPTS)rec.final=true;saveRec(rec);
  const isBest=bestRun(rec)===rec.runs[rec.runs.length-1]||(bestRun(rec)&&bestRun(rec).code===run.code);
  const improved=!prevBest||isBest&&(gi<prevBest.gi||(gi===prevBest.gi&&sc>prevBest.sc));
  const left=leftOf(rec),best=bestRun(rec),BG=GRADES[best.gi];
  app.innerHTML=`
  <div class="fade-in pb-8">
    <div class="text-center mt-4">
      <div class="text-6xl pop">🚪✨</div>
      <p class="font-orb text-emerald-400 glow-e text-xl mt-2">LOCKDOWN RELEASED</p>
      <h2 class="text-2xl font-black mt-1">탈출 성공!</h2>
      <pre id="endLog" class="font-mono2 text-[12px] text-pink-300 mt-2 whitespace-pre-wrap"></pre>
    </div>
    <div class="panel rounded-2xl p-4 mt-4 text-center pop" style="border-color:${G.color};box-shadow:0 0 30px ${G.color}55">
      <p class="text-[12px] text-slate-400">${S.attempt}회차 결과 ${improved&&prevBest?'<b class="text-amber-300">· 🏆 최고 기록 갱신!</b>':''}</p>
      <div class="flex items-center justify-center gap-4 mt-1">
        <span class="font-orb font-black text-6xl" style="color:${G.color};text-shadow:0 0 18px ${G.color}">${G.g}</span>
        <div class="text-left"><p class="font-orb text-3xl">${sc}<span class="text-base text-slate-400">점</span></p><p class="text-sm font-bold" style="color:${G.color}">${G.title}</p></div>
      </div>
    </div>
    <div class="grid grid-cols-4 gap-2 mt-3 text-center">
      <div class="panel rounded-2xl p-2"><p class="text-[10px] text-slate-400">소요</p><p class="font-orb text-base text-cyan-300">${fmtDur(dur)}</p></div>
      <div class="panel rounded-2xl p-2"><p class="text-[10px] text-slate-400">원샷</p><p class="font-orb text-base text-emerald-300">${S.perfect}/${total}</p></div>
      <div class="panel rounded-2xl p-2"><p class="text-[10px] text-slate-400">오답</p><p class="font-orb text-base text-red-300">${S.mistakes}</p></div>
      <div class="panel rounded-2xl p-2"><p class="text-[10px] text-slate-400">힌트</p><p class="font-orb text-base text-amber-300">${S.hints}</p></div>
    </div>
    <div class="rounded-2xl border border-amber-400/60 bg-amber-400/10 p-4 mt-3 text-[13px]">
      <p>🏆 현재 최고 등급: <b style="color:${BG.color}">${BG.g}등급 (${best.sc}점)</b> → <b>${BG.prize}</b></p>
      <p class="mt-1 text-slate-300">${left>0?`남은 도전 기회 <b class="text-emerald-300">${left}번</b> — 더 높은 등급에 도전할 수 있어요!`:'🔒 도전 기회를 모두 사용해 기록이 최종 확정되었어요.'}</p>
    </div>
    <div id="nameArea"></div>
    <button id="certBtn" class="btn-solid w-full rounded-2xl p-4 mt-3 text-base">🎁 선물 교환 인증서 보기</button>
    ${left>0?`<button id="retryBtn" class="btn-neon w-full rounded-2xl p-4 mt-3 text-sm text-emerald-300 font-bold">🔁 다시 도전하기 (남은 기회 ${left}번)</button>`:''}
    <button id="homeBtn" class="btn-neon w-full rounded-2xl p-4 mt-3 text-sm text-slate-300">🏠 처음 화면으로</button>
  </div>`;
  typeText($('#endLog'),'ARGOS: "...인정하지. 너는 AI를 읽는 힘과 보는 힘을 모두 가졌다."',24);
  $('#certBtn').onclick=()=>{SFX.unlock();screenCert();};
  if($('#retryBtn'))$('#retryBtn').onclick=()=>{SFX.tap();screenMenu();};
  $('#homeBtn').onclick=()=>{SFX.tap();screenMenu();};
}

/* 학번·이름 입력 (최초 1회만, 이후 고정) */
function askName(area,onDone){
  area.innerHTML=`<div class="panel rounded-2xl p-4 mt-4 pop">
    <p class="font-bold text-cyan-300 mb-2">🪪 요원 등록 (최초 1회)</p>
    <input id="sid" inputmode="numeric" maxlength="6" placeholder="학번 (예: 10312)" class="w-full rounded-xl bg-black/50 border border-cyan-500/40 p-4 text-base outline-none focus:border-cyan-300 mb-2">
    <input id="sname" maxlength="10" placeholder="이름" class="w-full rounded-xl bg-black/50 border border-cyan-500/40 p-4 text-base outline-none focus:border-cyan-300">
    <p class="text-[11px] text-slate-500 mt-2">※ 한 번 등록하면 학번·이름을 바꿀 수 없어요. 정확히 입력하세요!</p>
    <button id="issueBtn" class="btn-solid w-full rounded-2xl p-4 mt-3 text-base">등록하고 인증서 발급</button></div>`;
  $('#issueBtn').onclick=()=>{
    const id=$('#sid').value.trim(),nm=$('#sname').value.trim();
    if(!/^\d{4,6}$/.test(id)){shakeEl($('#sid'));SFX.wrong();$('#sid').focus();return;}
    if(nm.length<2){shakeEl($('#sname'));SFX.wrong();$('#sname').focus();return;}
    if(!confirm(`학번 ${id} / 이름 ${nm}\n이대로 등록할까요? (수정 불가)`))return;
    const rec=loadRec();rec.sid=id;rec.sname=nm;saveRec(rec);SFX.unlock();onDone();
  };
}

  if(!best){screenMenu();return;}
  const G=GRADES[best.gi],left=leftOf(rec);

    $('#certArea').innerHTML=`<div class="text-center mt-6"><p class="text-4xl">🪪</p><p class="font-black text-xl mt-2">인증서 발급 전 요원 등록</p><p class="text-sm text-slate-400 mt-1">선물 수령 확인을 위해 학번과 이름이 필요해요</p></div>`;
    const a=document.createElement('div');$('#certArea').appendChild(a);askName(a,screenCert);return;
  }

        <div class="flex items-start justify-between mt-2">
          <div>
            <p class="font-orb text-[10px] tracking-[.25em] text-cyan-400">CORE // PRIZE CERTIFICATE</p>
            <p class="text-lg font-black mt-1">🎁 선물 교환 인증서</p>
            <p class="text-sm font-bold mt-0.5" style="color:${G.color}">최고 기록 · ${G.title} · ${best.sc}점</p>
          </div>
          <div class="seal w-16 h-16 rounded-full flex items-center justify-center font-orb font-black text-3xl text-slate-900" style="background:conic-gradient(#06b6d4,#a855f7,#10b981,#facc15,#06b6d4);box-shadow:0 0 20px rgba(168,85,247,.6)">${G.g}</div>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-3">
          <div><p class="text-[10px] text-slate-500">학번</p><p class="font-orb text-xl">${esc(rec.sid)}</p></div>
          <div><p class="text-[10px] text-slate-500">이름</p><p class="text-xl font-black">${esc(rec.sname)}</p></div>
        </div>
        <div class="mt-3 rounded-xl bg-black/50 border border-cyan-500/40 p-3 text-center">
          <p class="text-[10px] text-slate-500">최고 기록 인증 코드</p>
          <p class="font-orb text-2xl text-cyan-300 glow-c tracking-wider">${best.code}</p>
        </div>
        <div class="mt-3 rounded-xl py-2 text-center font-black text-slate-900" style="background:${G.color}">${G.prize}</div>

          <div class="grid grid-cols-${MAX_ATTEMPTS} gap-1.5 text-center">

              const isB=r&&r.code===best.code;
              return `<div class="rounded-lg py-1.5 ${isB?'ring-2 ring-amber-300':''}" style="background:rgba(15,23,42,.7)">
